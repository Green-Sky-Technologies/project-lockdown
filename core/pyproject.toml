[project]
name = "lockdown-core"
version = "0.1.0"
description = "Project Lockdown detection core — stateless classifier + async pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.40",
    "langgraph>=0.2.50",
    "langsmith>=0.1.140",
    "clerk-backend-api>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockdown_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
