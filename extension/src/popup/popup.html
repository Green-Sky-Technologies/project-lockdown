<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .muted {
        color: #666;
        font-size: 12px;
        margin: 0 0 14px;
      }
      #signin {
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #10a37f;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🔒 Project Lockdown</h1>
    <p class="muted">Monitoring is disclosed. Sign in to enable it on this device.</p>
    <div id="signed-out" hidden>
      <button id="signin">Sign in</button>
    </div>
    <div id="signed-in" hidden>
      <div id="user"></div>
    </div>
    <div id="status">Loading…</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
