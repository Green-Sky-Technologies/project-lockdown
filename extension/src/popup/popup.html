<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 300px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        background: #fff;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #ececec;
        font-weight: 600;
      }
      #body {
        padding: 16px;
      }
      #status {
        font-size: 13px;
        color: #444;
        margin: 0 0 12px;
      }
      #status.active {
        color: #0a7d55;
      }
      button {
        width: 100%;
        padding: 9px 14px;
        border-radius: 8px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        border: none;
        background: #10a37f;
        color: #fff;
      }
      button.secondary {
        border: 1px solid #d0d0d0;
        background: #fff;
        color: #333;
      }
      button + button,
      input + button {
        margin-top: 8px;
      }
      input {
        width: 100%;
        padding: 9px 11px;
        margin-top: 10px;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        font: inherit;
        box-sizing: border-box;
      }
      .hint {
        font-size: 12px;
        color: #888;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <header>🔒 Project Lockdown</header>
    <div id="body">
      <p id="status">Loading…</p>
      <div id="actions"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
