<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Project Lockdown</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        background: #f6f7f9;
      }
      .wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p.sub {
        margin: 0;
        color: #666;
        text-align: center;
      }
      #clerk {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .done {
        text-align: center;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        box-sizing: border-box;
      }
      .done h2 {
        margin: 0 0 6px;
        color: #0a7d55;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🔒 Project Lockdown</h1>
      <p class="sub">Sign in to enable disclosed monitoring on this device.</p>
      <div id="clerk"></div>
    </div>
    <script type="module" src="signin.js"></script>
  </body>
</html>
